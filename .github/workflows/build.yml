name: build-on-summaries

on:
  push:
    branches: [main]
    paths:
      - 'data/summaries/**'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: rebuild site data
        run: python build.py

      - name: commit & push
        run: |
          cd "$GITHUB_WORKSPACE"
          git config user.name "PawService"
          git config user.email "pawservice@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "nothing to commit"; exit 0
          fi
          git commit -m "build site from summaries $(date +%F)"
          git push
