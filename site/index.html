<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PawService · 文献速览</title>
<style>
  :root {
    --bg: #f6f7fb;
    --card: #ffffff;
    --ink: #1f2430;
    --muted: #7a8194;
    --line: #e7eaf1;
    --accent: #5b6cff;
    --accent-soft: #eef0ff;
    --cross: #ff7a59;
    --cross-soft: #fff0ec;
    --cs: #0ea5a0;
    --cs-soft: #e7f7f6;
    --mat: #a855f7;
    --mat-soft: #f4ebff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
      "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    line-height: 1.6;
  }
  header {
    background: linear-gradient(135deg, #5b6cff 0%, #8b5cf6 100%);
    color: #fff; padding: 40px 24px 30px; text-align: center;
  }
  header h1 { margin: 0 0 6px; font-size: 28px; letter-spacing: .5px; }
  header p { margin: 0; opacity: .9; font-size: 14px; }
  .wrap { max-width: 900px; margin: 0 auto; padding: 0 16px; }
  .stats {
    display: flex; gap: 12px; flex-wrap: wrap; justify-content: center;
    margin: -20px auto 20px; position: relative; z-index: 2;
  }
  .stat {
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    padding: 10px 18px; box-shadow: 0 2px 10px rgba(30,40,90,.06);
    font-size: 13px; color: var(--muted);
  }
  .stat b { display: block; font-size: 20px; color: var(--ink); }
  .controls { position: sticky; top: 0; background: var(--bg); padding: 12px 0; z-index: 5; }
  .search {
    width: 100%; padding: 12px 16px; border: 1px solid var(--line);
    border-radius: 12px; font-size: 15px; outline: none; background: var(--card);
  }
  .search:focus { border-color: var(--accent); }
  .filters { display: flex; gap: 8px; flex-wrap: wrap; margin: 12px 0; }
  .chip {
    border: 1px solid var(--line); background: var(--card); color: var(--muted);
    padding: 6px 14px; border-radius: 999px; cursor: pointer; font-size: 13px;
    user-select: none; transition: .15s;
  }
  .chip:hover { border-color: var(--accent); color: var(--accent); }
  .chip.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  .chip.cross.active { background: var(--cross); border-color: var(--cross); }
  .count { color: var(--muted); font-size: 13px; margin: 4px 0 12px; }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    padding: 16px 18px; margin-bottom: 12px; transition: .15s;
  }
  .card:hover { box-shadow: 0 4px 18px rgba(30,40,90,.08); transform: translateY(-1px); }
  .card h3 { margin: 0 0 8px; font-size: 16px; line-height: 1.4; }
  .card h3 a { color: var(--ink); text-decoration: none; }
  .card h3 a:hover { color: var(--accent); }
  .badges { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
  .badge {
    font-size: 11px; padding: 2px 9px; border-radius: 999px; font-weight: 600;
  }
  .badge.topic { background: var(--cs-soft); color: var(--cs); }
  .badge.topic.mat { background: var(--mat-soft); color: var(--mat); }
  .badge.cross { background: var(--cross-soft); color: var(--cross); }
  .badge.date { background: #eef0f3; color: var(--muted); }
  .summary { color: #3a4152; font-size: 14px; margin: 0 0 8px; }
  .meta { color: var(--muted); font-size: 12px; }
  .empty { text-align: center; color: var(--muted); padding: 60px 0; }
  footer { text-align: center; color: var(--muted); font-size: 12px; padding: 30px 0 40px; }
  footer a { color: var(--muted); }
</style>
</head>
<body>
<header>
  <h1>🦉 PawService 文献速览</h1>
  <p>材料 × 计算机 · 每日抓取 · 分类 + 中文摘要</p>
</header>

<div class="wrap">
  <div class="stats">
    <div class="stat"><b id="statTotal">—</b>论文总数</div>
    <div class="stat"><b id="statCross">—</b>交叉学科</div>
    <div class="stat"><b id="statDays">—</b>覆盖天数</div>
  </div>

  <div class="controls">
    <input class="search" id="search" placeholder="搜索标题 / 摘要 / 作者 …" />
    <div class="filters" id="domainFilter">
      <div class="chip active" data-domain="all">全部</div>
      <div class="chip cross" data-domain="cross">🔬 交叉学科</div>
      <div class="chip" data-domain="计算机">计算机</div>
      <div class="chip" data-domain="材料">材料</div>
    </div>
    <div class="filters" id="crossFilter"></div>
    <div class="count" id="count"></div>
  </div>

  <div id="list"></div>
</div>

<footer>
  数据源 <a href="https://github.com/Gillian0926/PawService" target="_blank">Gillian0926/PawService</a> · 由爪爪 🦉 维护
</footer>

<script>
let PAPERS = [];
let domain = 'all';
let crossTag = null;
let query = '';

const CROSS_ORDER = ['计算材料学','计算建模','材料器件','AI4Science','量子信息','机器学习材料'];

fetch('papers.json')
  .then(r => r.json())
  .then(data => {
    PAPERS = data;
    initStats();
    initCrossFilter();
    render();
  })
  .catch(e => {
    document.getElementById('list').innerHTML = '<div class="empty">加载数据失败：' + e + '</div>';
  });

function initStats() {
  document.getElementById('statTotal').textContent = PAPERS.length;
  document.getElementById('statCross').textContent = PAPERS.filter(p => p.crossover).length;
  const days = new Set(PAPERS.map(p => p.date));
  document.getElementById('statDays').textContent = days.size;
}

function initCrossFilter() {
  const tags = CROSS_ORDER.filter(t => PAPERS.some(p => p.crossover === t));
  const el = document.getElementById('crossFilter');
  tags.forEach(t => {
    const d = document.createElement('div');
    d.className = 'chip cross';
    d.dataset.cross = t;
    d.textContent = t;
    el.appendChild(d);
  });
}

function matches(p) {
  if (domain === 'cross' && !p.crossover) return false;
  if (domain === '计算机' && !p.topic.startsWith('计算机')) return false;
  if (domain === '材料' && !p.topic.startsWith('材料')) return false;
  if (crossTag && p.crossover !== crossTag) return false;
  if (query) {
    const q = query.toLowerCase();
    const hay = (p.title + ' ' + (p.summary || '') + ' ' + (p.authors || []).join(' ')).toLowerCase();
    if (!hay.includes(q)) return false;
  }
  return true;
}

function render() {
  const list = PAPERS.filter(matches);
  document.getElementById('count').textContent = '显示 ' + list.length + ' / ' + PAPERS.length + ' 篇';
  const el = document.getElementById('list');
  if (!list.length) {
    el.innerHTML = '<div class="empty">没有匹配的论文 🦉</div>';
    return;
  }
  el.innerHTML = list.map(card).join('');
}

function card(p) {
  const isMat = p.topic.startsWith('材料');
  const topicCls = isMat ? 'topic mat' : 'topic';
  const authors = (p.authors || []).slice(0, 3).join(', ') + ((p.authors || []).length > 3 ? ' 等' : '');
  const badges =
    '<span class="badge ' + topicCls + '">' + esc(p.topic) + '</span>' +
    (p.crossover ? '<span class="badge cross">交叉·' + esc(p.crossover) + '</span>' : '') +
    '<span class="badge date">' + esc(p.date) + '</span>';
  return '<div class="card">' +
    '<h3><a href="' + esc(p.link) + '" target="_blank">' + esc(p.title) + '</a></h3>' +
    '<div class="badges">' + badges + '</div>' +
    '<p class="summary">' + esc(p.summary || '') + '</p>' +
    '<div class="meta">' + esc(authors) + '</div>' +
    '</div>';
}

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
}

document.getElementById('search').addEventListener('input', e => {
  query = e.target.value.trim().toLowerCase();
  render();
});

document.getElementById('domainFilter').addEventListener('click', e => {
  const chip = e.target.closest('.chip');
  if (!chip) return;
  domain = chip.dataset.domain;
  document.querySelectorAll('#domainFilter .chip').forEach(c => c.classList.remove('active'));
  chip.classList.add('active');
  render();
});

document.getElementById('crossFilter').addEventListener('click', e => {
  const chip = e.target.closest('.chip');
  if (!chip) return;
  const t = chip.dataset.cross;
  if (crossTag === t) {
    crossTag = null;
    chip.classList.remove('active');
  } else {
    crossTag = t;
    document.querySelectorAll('#crossFilter .chip').forEach(c => c.classList.remove('active'));
    chip.classList.add('active');
  }
  render();
});
</script>
</body>
</html>
